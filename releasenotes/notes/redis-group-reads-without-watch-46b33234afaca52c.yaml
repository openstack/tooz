---
fixes:
  - |
    The Redis driver no longer reads groups inside a ``WATCH`` transaction.
    Previously, whenever a member joined or left a group, or an expired
    member was removed from it, an in-progress ``get_members()`` or
    ``get_members_with_capabilities()`` call for that group could restart
    from the beginning, without a retry limit. As a result, reads of large
    groups could stall if many members were rejoining, e.g. after a failover.
    Expired members are now removed by a script that rechecks each member's
    liveness key before removal, preserving members that have heartbeated
    since the initial liveness check. ``get_member_capabilities()`` now sends
    one command when the member exists, instead of five.
